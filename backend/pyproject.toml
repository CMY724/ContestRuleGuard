[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "contest-rule-guard"
version = "0.1.0"
description = "证据图驱动的竞赛合规智能体"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<12",
  "pydantic-settings==2.10.1",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "rapidocr-onnxruntime>=1.3,<2",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contest_rule_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"src/contest_rule_guard/rules/prompts.py" = ["E501"]
"src/contest_rule_guard/review/reporter.py" = ["E501"]
